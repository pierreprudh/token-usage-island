name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: swift --version

      - name: Resolve version
        id: version
        run: |
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${REF#v}"
          echo "tag=$REF"        >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./build.sh

      - name: Package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ZIP="TokenUsageIsland-${VERSION}.zip"
          # ditto preserves the bundle + resource forks so the .app survives zip round-trips.
          ditto -c -k --sequesterRsrc --keepParent "build/Token Usage Island.app" "$ZIP"
          SHA=$(shasum -a 256 "$ZIP" | awk '{print $1}')
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "### Homebrew cask values" >> "$GITHUB_STEP_SUMMARY"
          echo '```ruby' >> "$GITHUB_STEP_SUMMARY"
          echo "version \"${VERSION}\"" >> "$GITHUB_STEP_SUMMARY"
          echo "sha256 \"${SHA}\""     >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.package.outputs.zip }}
          body: |
            ### Install

            ```bash
            brew install --cask --no-quarantine pierreprudh/tap/token-usage-island
            ```

            (`--no-quarantine` is needed because the app is ad-hoc signed rather than notarized.)

            **SHA-256:** `${{ steps.package.outputs.sha256 }}`

      # Auto-bumps the cask in the tap repo. Optional: only runs if a TAP_TOKEN
      # secret (a PAT with `contents:write` on pierreprudh/homebrew-tap) is set.
      - name: Update Homebrew tap
        if: ${{ env.TAP_TOKEN != '' }}
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/pierreprudh/homebrew-tap.git" tap
          CASK="tap/Casks/token-usage-island.rb"
          /usr/bin/sed -i '' -E "s/version \".*\"/version \"${VERSION}\"/" "$CASK"
          /usr/bin/sed -i '' -E "s/sha256 \".*\"/sha256 \"${SHA256}\"/" "$CASK"
          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Casks/token-usage-island.rb"
          git commit -m "token-usage-island ${VERSION}" || { echo "no changes"; exit 0; }
          git push
